<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Станция ТТК — рецепты и себестоимость</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C2A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Станция ТТК">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#EFE7D6; --ticket:#FBF7EE; --ink:#231F19; --ink-soft:#6B6357;
    --wine:#7C2A3B; --wine-deep:#5A1E2B; --copper:#A9723A; --sage:#56684A; --rust:#9C3B26;
    --line:#DCCFAE; --focus:#2F6F5E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); background-image: radial-gradient(circle at 1px 1px, rgba(35,31,25,0.05) 1px, transparent 0); background-size:22px 22px; color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; }
  ::selection{ background:var(--wine); color:#fff; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .shell{ max-width:1080px; margin:0 auto; padding:16px 14px 8px; }

  .masthead{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; border-bottom:2px solid var(--ink); padding-bottom:14px;}
  .masthead h1{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0; letter-spacing:-.01em; }
  .masthead .sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .util-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dot{ width:7px; height:7px; border-radius:50%; display:block; position:absolute; top:3px; right:3px; }
  .dot.ok{ background:var(--sage); } .dot.off{ background:var(--rust); }

  .icon-btn{ position:relative; width:38px; height:38px; border-radius:50%; background:transparent; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0; }
  .icon-btn:hover{ background:rgba(35,31,25,0.06); }
  .icon-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .sync-note{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin:8px 0 16px; line-height:1.5; }

  /* ---------- Bottom nav (mobile app style) ---------- */
  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--ticket); border-top:1.5px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:40; box-shadow:0 -4px 14px rgba(0,0,0,0.06); }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:transparent; border:none; color:var(--ink-soft); padding:6px 2px 4px; font-size:10px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.02em; border-radius:6px; }
  .nav-item svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item.active{ color:var(--wine); }

  /* ---------- Floating action button ---------- */
  .fab{ position:fixed; right:16px; bottom:calc(70px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--wine); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(35,31,25,0.35); border:none; z-index:41; }
  .fab:hover{ background:var(--wine-deep); }
  .fab svg{ width:26px; height:26px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .install-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--ink); color:var(--ticket); border-radius:4px; padding:12px 14px; margin-bottom:16px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .install-banner button{ background:var(--copper); color:var(--ink); border:none; padding:8px 12px; border-radius:3px; font-weight:600; font-size:12px; white-space:nowrap; }
  .install-banner .x{ background:transparent; color:#B9AF9D; border:none; font-size:16px; padding:2px 6px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .toolbar input[type=text]{ flex:1; min-width:180px; background:var(--ticket); border:1.5px solid var(--line); padding:10px 12px; border-radius:3px; font-size:14px; color:var(--ink); }
  select.filter{ background:var(--ticket); border:1.5px solid var(--line); padding:10px 12px; border-radius:3px; font-size:13px; color:var(--ink); }
  .btn{ background:var(--wine); color:#fff; border:none; padding:11px 18px; border-radius:3px; font-weight:600; font-size:13.5px; letter-spacing:.01em; white-space:nowrap; }
  .btn:hover{ background:var(--wine-deep); }
  .btn.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.secondary:hover{ background:rgba(35,31,25,0.06); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1.5px dashed var(--line); }
  .btn.danger{ background:transparent; color:var(--rust); border:1.5px solid var(--rust); padding:7px 10px; font-size:12px;}
  .btn.danger:hover{ background:rgba(156,59,38,0.08); }
  .btn.small{ padding:7px 12px; font-size:12.5px; }

  .empty{ border:1.5px dashed var(--line); border-radius:4px; padding:48px 20px; text-align:center; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .empty strong{ display:block; font-family:'Fraunces',serif; font-size:19px; color:var(--ink); font-weight:600; margin-bottom:8px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .ticket{ position:relative; background:var(--ticket); border:1px solid var(--line); border-radius:2px; padding:22px 16px 16px; box-shadow:0 1px 0 rgba(35,31,25,0.04); }
  .ticket::before{ content:""; position:absolute; top:-1px; left:0; right:0; height:14px; background-image: radial-gradient(circle at 10px 7px, var(--paper) 7px, transparent 7.6px); background-size:20px 14px; background-repeat:repeat-x; background-position:2px 0; }
  .ticket .cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); }
  .ticket h3{ font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin:4px 0 10px; line-height:1.15; padding-right:70px;}
  .ticket .row-line{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); padding:3px 0; border-top:1px dashed var(--line); }
  .ticket .row-line b{ color:var(--ink); font-weight:600; }
  .ticket .actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

  .stamp{ position:absolute; top:16px; right:14px; transform:rotate(-7deg); border:2px dashed var(--sage); color:var(--sage); border-radius:6px; padding:5px 8px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.09em; text-align:center; line-height:1.25; }
  .stamp b{ display:block; font-size:15px; letter-spacing:0; }
  .stamp.warn{ border-color:var(--copper); color:var(--copper); }
  .stamp.danger{ border-color:var(--rust); color:var(--rust); }

  .panel{ background:var(--ticket); border:1px solid var(--line); border-radius:4px; padding:22px 18px; margin-bottom:18px; }
  .panel h2{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 16px; font-weight:600; border-bottom:1px solid var(--line); padding-bottom:10px;}
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:140px; }
  .field label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); }
  .field input, .field select, .field textarea{ background:#fff; border:1.5px solid var(--line); padding:9px 10px; border-radius:3px; font-size:14px; color:var(--ink); }
  .field textarea{ resize:vertical; min-height:52px; font-family:'Inter',sans-serif; }

  table.rows-table{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.rows-table th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:6px 6px; border-bottom:1.5px solid var(--ink); }
  table.rows-table td{ padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:top; position:relative; }
  table.rows-table input, table.rows-table select{ width:100%; background:#fff; border:1.5px solid var(--line); padding:7px 8px; border-radius:3px; font-size:13px; }
  table.rows-table td.cost-cell{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13.5px; white-space:nowrap; padding-top:12px;}
  table.rows-table td.loss-note{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; padding-top:12px;}
  table.rows-table td.rm-cell{ text-align:center; padding-top:9px; }

  .ac-list{ position:absolute; top:100%; left:6px; right:6px; background:#fff; border:1.5px solid var(--line); border-top:none; max-height:190px; overflow-y:auto; z-index:30; border-radius:0 0 4px 4px; box-shadow:0 8px 16px rgba(0,0,0,0.14); display:none; }
  .ac-item{ padding:7px 10px; font-size:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .ac-item:last-child{ border-bottom:none; }
  .ac-item:hover{ background:rgba(124,42,59,0.08); }
  .ac-item .tag{ font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; padding:1px 5px; border-radius:3px; margin-left:6px; }
  .ac-item .tag.product{ background:rgba(86,104,74,0.16); color:var(--sage); }
  .ac-item .tag.semi{ background:rgba(169,114,58,0.18); color:var(--copper); }
  .ac-item .price{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }

  .steps-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .step-item{ display:flex; gap:8px; align-items:flex-start; }
  .step-num{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--wine); padding-top:10px; width:22px; flex-shrink:0; }
  .step-item textarea{ flex:1; background:#fff; border:1.5px solid var(--line); border-radius:3px; padding:9px 10px; font-size:14px; min-height:44px; }

  .summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; background:var(--ink); color:var(--ticket); border-radius:4px; padding:18px; margin:16px 0; }
  .summary .cell .lbl{ font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:#B9AF9D; margin-bottom:4px;}
  .summary .cell .val{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:600; }
  .summary .cell .val.accent{ color:#E3B98E; }
  .summary .cell .sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#B9AF9D; margin-top:3px;}

  .form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; }

  table.ing-table{ width:100%; border-collapse:collapse; }
  table.ing-table th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:8px 8px; border-bottom:1.5px solid var(--ink); }
  table.ing-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  table.ing-table input, table.ing-table select{ width:100%; background:#fff; border:1.5px solid var(--line); padding:8px 9px; border-radius:3px; font-size:13.5px; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ticket); padding:12px 20px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.25); z-index:50; border-left:4px solid var(--sage); }
  .toast.error{ border-left-color:var(--rust); }
  .hint{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin:-6px 0 14px; }

  /* ---------- Simple clean TTK document view ---------- */
  .doc-actions{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .doc{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:32px; max-width:720px; margin:0 auto; }
  .doc-head{ border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .doc-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); }
  .doc-head h2{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin:4px 0 8px; }
  .doc-meta{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
  .doc h3{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:22px 0 8px; text-transform:uppercase; letter-spacing:.03em; }
  table.doc-table{ width:100%; border-collapse:collapse; }
  table.doc-table th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:6px 8px; border-bottom:1.5px solid var(--ink); }
  table.doc-table td{ padding:7px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  ol.doc-steps{ padding-left:20px; margin:0; }
  ol.doc-steps li{ margin-bottom:8px; font-size:14.5px; line-height:1.5; }
  .doc-notes{ font-size:14.5px; line-height:1.55; white-space:pre-wrap; }

  @media print{
    body{ background:#fff !important; }
    .masthead, .bottom-nav, .fab, .sync-note, .no-print{ display:none !important; }
    .shell{ padding:0; max-width:100%; }
    .doc{ box-shadow:none; border:none; padding:0; max-width:100%; }
  }

  @media (max-width:640px){
    .masthead h1{ font-size:22px; }
    table.rows-table thead{ display:none; }
    table.rows-table td{ display:block; width:100%; border-bottom:none; padding:3px 0; }
    table.rows-table tr{ display:block; border-bottom:1.5px dashed var(--line); padding-bottom:10px; margin-bottom:10px; }
    .ac-list{ left:0; right:0; }
    .doc{ padding:18px; }
  }

  body{ padding-bottom:calc(78px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
/* ======================= CONST ======================= */
const CATEGORIES = ['Холодные закуски','Горячие закуски','Супы','Горячее','Гарниры','Десерты','Хлеб и выпечка','Соусы и заправки','Напитки'];
const UNIT_LABEL = { g:'г (цена за кг)', ml:'мл (цена за л)', pcs:'шт (цена за шт)' };

const ICONS = {
  plate: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/></svg>`,
  flask: `<svg viewBox="0 0 24 24"><path d="M9 2h6M10 2v6.2l-5.2 9a2 2 0 0 0 1.73 3h11a2 2 0 0 0 1.73-3l-5.2-9V2"/></svg>`,
  basket: `<svg viewBox="0 0 24 24"><path d="M4 9h16l-1.4 9.4A2 2 0 0 1 16.6 20H7.4a2 2 0 0 1-2-1.6L4 9Z"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9"/></svg>`,
  gear: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h1.2M18.8 12H20M12 4v1.2M12 18.8V20M6.3 6.3l.9.9M16.8 16.8l.9.9M6.3 17.7l.9-.9M16.8 7.2l.9-.9"/></svg>`,
  download: `<svg viewBox="0 0 24 24"><path d="M12 3v11m0 0-3.5-3.5M12 14l3.5-3.5"/><path d="M5 19h14"/></svg>`,
  upload: `<svg viewBox="0 0 24 24"><path d="M12 21V10m0 0-3.5 3.5M12 10l3.5 3.5"/><path d="M5 5h14"/></svg>`,
  plus: `<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
};

/* ======================= STATE ======================= */
let state = {
  view: 'list', // list | form | semilist | semiform | ingredients | settings | viewrecipe | viewsemi
  recipes: [], ingredients: [], semifinished: [],
  loaded: false, binId: '', apiKey: '',
  search: '', categoryFilter: '',
  editingId: null, viewingId: null,
  formRows: [], formSteps: [''],
  formMeta: { name:'', category:'', portions:1, foodCostTarget:30, notes:'' },
  pfEditingId: null, pfFormRows: [], pfFormSteps: [''],
  pfFormMeta: { name:'', outputUnit:'g', outputQty:'', notes:'' },
  toastTimer: null,
};

/* ======================= UTIL ======================= */
function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ if(isNaN(n)) n=0; return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:0}).format(n) + ' ₽'; }
function num(v){ const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? 0 : n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function baseUnitLabel(u){ return u==='pcs' ? 'шт' : (u==='ml' ? 'л' : 'кг'); }
function unitG(u){ return u==='pcs'?'шт':(u==='ml'?'мл':'г'); }

function computeRowCost(row){
  const gross = num(row.gross), price = num(row.price);
  if(row.unitType === 'pcs') return gross * price;
  return (gross/1000) * price;
}
function rowLossPercent(row){
  const gross = num(row.gross), net = num(row.net);
  if(!gross || !net) return null;
  return Math.max(0, (1 - net/gross) * 100);
}
function computeTotals(rows, portions, foodCostTarget){
  const totalCost = rows.reduce((s,r)=>s+computeRowCost(r),0);
  const p = portions > 0 ? portions : 1;
  const costPerPortion = totalCost / p;
  const suggested = foodCostTarget > 0 ? costPerPortion / (foodCostTarget/100) : 0;
  const rounded = Math.round(suggested/10)*10;
  const actualFcAtRounded = rounded > 0 ? (costPerPortion/rounded*100) : 0;
  return { totalCost, costPerPortion, suggested, rounded, actualFcAtRounded };
}
function stampClass(fc){ if(fc <= 28) return ''; if(fc <= 35) return 'warn'; return 'danger'; }
function semiCostPerBase(sf){
  const totalCost = (sf.rows||[]).reduce((s,r)=>s+computeRowCost(r),0);
  if(!sf.outputQty || num(sf.outputQty)<=0) return 0;
  if(sf.outputUnit==='pcs') return totalCost/num(sf.outputQty);
  return totalCost/(num(sf.outputQty)/1000);
}

/* ======================= LOCAL CONFIG (best-effort) ======================= */
function getStored(key){ try{ return localStorage.getItem(key) || ''; }catch(e){ return ''; } }
function setStored(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }

/* ======================= JSONBIN.IO ======================= */
function readUrl(){ return 'https://api.jsonbin.io/v3/b/' + state.binId + '/latest'; }
function writeUrl(){ return 'https://api.jsonbin.io/v3/b/' + state.binId; }

async function loadData(){
  state.binId = getStored('ttk-bin-id');
  state.apiKey = getStored('ttk-api-key');
  if(!state.binId || !state.apiKey){
    state.loaded = true; state.view = 'settings'; render(); return;
  }
  try{
    const res = await fetch(readUrl(), { headers: { 'X-Master-Key': state.apiKey } });
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    const rec = (data && data.record) || {};
    state.recipes = Array.isArray(rec.recipes) ? rec.recipes : [];
    state.ingredients = Array.isArray(rec.ingredients) ? rec.ingredients : [];
    state.semifinished = Array.isArray(rec.semifinished) ? rec.semifinished : [];
    state.loaded = true; render();
  }catch(e){
    state.recipes = []; state.ingredients = []; state.semifinished = [];
    state.loaded = true; render();
    showToast('Не удалось загрузить базу. Проверь Bin ID и API-ключ.', 'error');
  }
}
async function persistAll(){
  if(!state.binId || !state.apiKey){ showToast('Сначала подключи базу во вкладке «База данных».', 'error'); return false; }
  try{
    const payload = { recipes: state.recipes, ingredients: state.ingredients, semifinished: state.semifinished };
    const res = await fetch(writeUrl(), { method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':state.apiKey}, body: JSON.stringify(payload) });
    if(!res.ok) throw new Error('http '+res.status);
    return true;
  }catch(e){ showToast('Не удалось сохранить в базу — проверь интернет, Bin ID и ключ.', 'error'); return false; }
}

/* ======================= TOAST ======================= */
function showToast(msg, type){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type==='error' ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>t.remove(), 3200);
}

/* ======================= BACKUP (доп. страховка) ======================= */
function exportBackup(){
  const payload = { recipes: state.recipes, ingredients: state.ingredients, semifinished: state.semifinished, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ttk-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Резервная копия скачана');
}
function triggerImport(){ const inp = document.getElementById('import-file-input'); if(inp) inp.click(); }
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!confirm('Импорт заменит текущие данные в подключённой базе данными из файла. Продолжить?')) return;
      state.recipes = Array.isArray(data.recipes) ? data.recipes : [];
      state.ingredients = Array.isArray(data.ingredients) ? data.ingredients : [];
      state.semifinished = Array.isArray(data.semifinished) ? data.semifinished : [];
      await persistAll();
      state.view = 'list'; render();
      showToast('Данные импортированы');
    }catch(err){ showToast('Файл повреждён или в неверном формате', 'error'); }
  };
  reader.readAsText(file);
}

/* ======================= AUTOCOMPLETE ======================= */
function findMatches(query, includeSemi){
  const q = query.trim().toLowerCase(); if(!q) return [];
  let matches = state.ingredients.filter(i=>i.name && i.name.toLowerCase().includes(q))
    .map(i=>({ name:i.name, unitType:i.unitType, price:num(i.price), kind:'product' }));
  if(includeSemi){
    matches = matches.concat(state.semifinished.filter(s=>s.name && s.name.toLowerCase().includes(q))
      .map(s=>({ name:s.name, unitType:s.outputUnit, price:semiCostPerBase(s), kind:'semi' })));
  }
  return matches.slice(0,8);
}
function renderSuggestionsBox(containerId, query, includeSemi){
  const el = document.getElementById(containerId); if(!el) return;
  const matches = findMatches(query, includeSemi);
  if(matches.length===0){ el.style.display='none'; el.innerHTML=''; return; }
  el.innerHTML = matches.map(m=>`
    <div class="ac-item" data-ac-name="${esc(m.name)}" data-ac-unit="${m.unitType}" data-ac-price="${m.price}" data-ac-kind="${m.kind}">
      <span>${esc(m.name)}<span class="tag ${m.kind}">${m.kind==='product'?'прод.':'п/ф'}</span></span>
      <span class="price">${money(m.price)}/${baseUnitLabel(m.unitType)}</span>
    </div>`).join('');
  el.style.display = 'block';
}
function closeAllSuggestions(){ document.querySelectorAll('.ac-list').forEach(el=>{ el.style.display='none'; el.innerHTML=''; }); }

/* ======================= RENDER: БЛЮДА LIST ======================= */
function renderListView(){
  let list = state.recipes.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(state.search.trim()){ const q = state.search.trim().toLowerCase(); list = list.filter(r => r.name.toLowerCase().includes(q)); }
  if(state.categoryFilter){ list = list.filter(r => r.category === state.categoryFilter); }

  const toolbar = `
    <div class="toolbar">
      <input type="text" placeholder="Поиск по названию блюда…" value="${esc(state.search)}" data-meta="search">
      <select class="filter" data-meta="categoryFilter">
        <option value="">Все категории</option>
        ${CATEGORIES.map(c=>`<option value="${esc(c)}" ${state.categoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <button class="btn" data-action="go-new">+ Новое блюдо</button>
    </div>`;

  if(state.recipes.length === 0){
    return toolbar + `
    <div class="empty">
      <strong>Пока пусто</strong>
      Оформите первую карточку блюда: ингредиенты (сырьё или полуфабрикаты) и технология — цена посчитается сама.
      <div style="margin-top:16px;"><button class="btn" data-action="go-new">Создать первую карточку</button></div>
    </div>`;
  }
  if(list.length === 0){ return toolbar + `<div class="empty">Ничего не найдено по этому фильтру.</div>`; }
  return toolbar + `<div class="grid">${list.map(renderTicket).join('')}</div>`;
}
function renderTicket(r){
  const { costPerPortion, rounded, actualFcAtRounded } = computeTotals(r.rows, r.portions, r.foodCostTarget);
  const cls = stampClass(actualFcAtRounded || r.foodCostTarget);
  return `
  <div class="ticket">
    <div class="stamp ${cls}">Food cost<b>${(actualFcAtRounded||r.foodCostTarget).toFixed(0)}%</b></div>
    <div class="cat">${esc(r.category || '—')}</div>
    <h3>${esc(r.name)}</h3>
    <div class="row-line"><span>Выход на порцию</span><b>${r.portions} порц.</b></div>
    <div class="row-line"><span>Себестоимость / порция</span><b>${money(costPerPortion)}</b></div>
    <div class="row-line"><span>Цена продажи (реком.)</span><b>${money(rounded)}</b></div>
    <div class="actions">
      <button class="btn secondary small" data-action="view-recipe" data-id="${r.id}">Смотреть ТТК</button>
      <button class="btn secondary small" data-action="edit-recipe" data-id="${r.id}">Редактировать</button>
      <button class="btn danger" data-action="delete-recipe" data-id="${r.id}">Удалить</button>
    </div>
  </div>`;
}

  const panel = document.getElementById('summary-panel'); if(panel) panel.innerHTML = renderSummaryInner();
}

      <tbody>${sf.rows.map(row=>`<tr><td>${esc(row.name)}</td><td>${row.gross||'—'} ${unitG(row.unitType)}</td><td>${row.net?row.net+' '+unitG(row.unitType):'—'}</td></tr>`).join('')}</tbody>
    </table>
    ${sf.steps && sf.steps.length ? `<h3>Технология обработки</h3><ol class="doc-steps">${sf.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    ${sf.notes ? `<h3>Хранение</h3><p class="doc-notes">${esc(sf.notes)}</p>` : ''}
  </div>`;
}

/* ======================= RENDER: ПОЛУФАБРИКАТ FORM ======================= */
function startNewSemi(){
  state.pfEditingId = null;
  state.pfFormMeta = { name:'', outputUnit:'g', outputQty:'', notes:'' };
  state.pfFormRows = [ { name:'', unitType:'g', gross:'', net:'', price:'', kind:'' } ];
  state.pfFormSteps = [''];
  state.view = 'semiform'; render();
}
function startEditSemi(id){
  const sf = state.semifinished.find(x=>x.id===id); if(!sf) return;
  state.pfEditingId = id;
  state.pfFormMeta = { name:sf.name, outputUnit:sf.outputUnit, outputQty:sf.outputQty, notes:sf.notes||'' };
  state.pfFormRows = sf.rows.map(row=>({...row}));
  state.pfFormSteps = sf.steps && sf.steps.length ? sf.steps.slice() : [''];
  state.view = 'semiform'; render();
}
function renderSemiFormView(){
  return `
  <div class="panel">
    <h2>${state.pfEditingId ? 'Редактирование полуфабриката' : 'Новый полуфабрикат'}</h2>
    <div class="field-row">
      <div class="field" style="flex:2;">
        <label>Название полуфабриката</label>
        <input type="text" data-pfmeta="name" value="${esc(state.pfFormMeta.name)}" placeholder="напр. Фарш из оленины">
      </div>
      <div class="field" style="max-width:160px;">
        <label>Единица выхода</label>
        <select data-pfmeta="outputUnit">
          ${Object.entries({g:'граммы',ml:'миллилитры',pcs:'штуки'}).map(([u,l])=>`<option value="${u}" ${state.pfFormMeta.outputUnit===u?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="max-width:160px;">
        <label>Выход партии, в ед. выше</label>
        <input type="number" min="0" step="0.001" data-pfmeta="outputQty" value="${state.pfFormMeta.outputQty}" placeholder="напр. 1000">
      </div>
    </div>

    <h2 style="margin-top:22px;">Состав (только сырьё)</h2>
    <p class="hint">Полуфабрикат собирается из продуктов справочника — начните вводить название, появятся совпадения. Вложенность «полуфабрикат из полуфабриката» пока не поддерживается.</p>
    <div id="pf-rows-wrap">${renderPfRowsTable()}</div>
    <button class="btn ghost small" data-action="add-pf-row">+ Добавить строку</button>

    <h2 style="margin-top:22px;">Технология обработки</h2>
    <div id="pf-steps-wrap" class="steps-list">${renderStepsList(state.pfFormSteps,'pfstep')}</div>
    <button class="btn ghost small" data-action="add-pfstep">+ Добавить шаг</button>

    <div class="field" style="margin-top:18px;">
      <label>Заметки / срок и условия хранения</label>
      <textarea data-pfmeta="notes" placeholder="условия хранения, срок годности…">${esc(state.pfFormMeta.notes)}</textarea>
    </div>

    <div class="summary" id="pf-summary-panel">${renderPfSummaryInner()}</div>

    <div class="form-actions">
      <button class="btn secondary" data-action="go-semilist">Отмена</button>
      <button class="btn" data-action="save-semi">Сохранить полуфабрикат</button>
    </div>
  </div>`;
}
function renderPfRowsTable(){
  const rowsHtml = state.pfFormRows.map((row,idx)=>{
    const loss = rowLossPercent(row);
    return `
    <tr data-pfrow="${idx}">
      <td style="min-width:170px;">
        <input type="text" autocomplete="off" placeholder="продукт" data-pffield="name" data-pfindex="${idx}" value="${esc(row.name)}">
        <div class="ac-list" id="ac-pf-${idx}"></div>
      </td>
      <td style="min-width:130px;">
        <select data-pffield="unitType" data-pfindex="${idx}">
          ${Object.keys(UNIT_LABEL).map(u=>`<option value="${u}" ${row.unitType===u?'selected':''}>${UNIT_LABEL[u]}</option>`).join('')}
        </select>
      </td>
      <td style="min-width:90px;"><input type="number" min="0" step="0.001" placeholder="брутто" data-pffield="gross" data-pfindex="${idx}" value="${row.gross}"></td>
      <td style="min-width:90px;"><input type="number" min="0" step="0.001" placeholder="нетто" data-pffield="net" data-pfindex="${idx}" value="${row.net}"></td>
      <td style="min-width:100px;"><input type="number" min="0" step="0.01" placeholder="цена" data-pffield="price" data-pfindex="${idx}" value="${row.price}"></td>
      <td class="cost-cell" id="pfrow-cost-${idx}">${money(computeRowCost(row))}</td>
      <td class="loss-note" id="pfrow-loss-${idx}">${loss!==null ? 'потери '+loss.toFixed(0)+'%' : ''}</td>
      <td class="rm-cell"><button class="btn danger" data-action="remove-pf-row" data-index="${idx}">✕</button></td>
    </tr>`;
  }).join('');
  return `<table class="rows-table"><thead><tr><th>Продукт (сырьё)</th><th>Ед. изм.</th><th>Брутто</th><th>Нетто</th><th>Цена за ед.</th><th>Стоимость</th><th>Потери</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
}
function renderPfSummaryInner(){
  const totalCost = state.pfFormRows.reduce((s,r)=>s+computeRowCost(r),0);
  const cost = semiCostPerBase({ rows: state.pfFormRows, outputUnit: state.pfFormMeta.outputUnit, outputQty: num(state.pfFormMeta.outputQty) });
  return `
    <div class="cell"><div class="lbl">Себестоимость партии</div><div class="val" id="pfsum-total">${money(totalCost)}</div></div>
    <div class="cell"><div class="lbl">Выход партии</div><div class="val" id="pfsum-output">${state.pfFormMeta.outputQty || 0} ${unitG(state.pfFormMeta.outputUnit)}</div></div>
    <div class="cell"><div class="lbl">Стоимость единицы</div><div class="val accent" id="pfsum-unit">${money(cost)} / ${baseUnitLabel(state.pfFormMeta.outputUnit)}</div></div>
  `;
}
function updateComputedUIPF(){
  state.pfFormRows.forEach((row,idx)=>{
    const costEl = document.getElementById('pfrow-cost-'+idx); if(costEl) costEl.textContent = money(computeRowCost(row));
    const lossEl = document.getElementById('pfrow-loss-'+idx);
    if(lossEl){ const loss = rowLossPercent(row); lossEl.textContent = loss!==null ? 'потери '+loss.toFixed(0)+'%' : ''; }
  });
  const panel = document.getElementById('pf-summary-panel'); if(panel) panel.innerHTML = renderPfSummaryInner();
}

/* ======================= RENDER: ПРОДУКТЫ (СЫРЬЁ) ======================= */
function renderIngredientsView(){
  const rows = state.ingredients.map((ing,idx)=>`
    <tr>
      <td><input type="text" data-ing-field="name" data-ing-index="${idx}" value="${esc(ing.name)}" placeholder="продукт"></td>
      <td>
        <select data-ing-field="unitType" data-ing-index="${idx}">
          ${Object.keys(UNIT_LABEL).map(u=>`<option value="${u}" ${ing.unitType===u?'selected':''}>${UNIT_LABEL[u]}</option>`).join('')}
        </select>
      </td>
      <td><input type="number" min="0" step="0.01" data-ing-field="price" data-ing-index="${idx}" value="${ing.price}" placeholder="цена"></td>
      <td><button class="btn danger" data-action="delete-ingredient" data-index="${idx}">✕</button></td>
    </tr>`).join('');
  const empty = state.ingredients.length===0 ? `<div class="empty">Справочник пуст. Добавьте сырьё с закупочной ценой — оно будет предлагаться при вводе полуфабрикатов и блюд.</div>` : '';
  return `
  <div class="panel">
    <h2>Продукты (сырьё)</h2>
    <p class="hint">Цена всегда за базовую единицу: за кг для граммов, за литр для мл, за штуку для шт.</p>
    ${empty}
    ${state.ingredients.length ? `
    <table class="ing-table">
      <thead><tr><th>Продукт</th><th>Единица</th><th>Цена</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : ''}
    <div style="margin-top:14px;"><button class="btn ghost small" data-action="add-ingredient">+ Добавить продукт</button></div>
  </div>`;
}

/* ======================= EVENTS ======================= */
const app = document.getElementById('app');

app.addEventListener('mousedown', (e)=>{
  const item = e.target.closest('.ac-item'); if(!item) return;
  e.preventDefault();
  const container = item.closest('.ac-list'); const cid = container.id;
  const name = item.dataset.acName, unitType = item.dataset.acUnit, price = item.dataset.acPrice, kind = item.dataset.acKind;
  if(cid.startsWith('ac-row-')){
    const idx = parseInt(cid.replace('ac-row-',''));
    state.formRows[idx].name = name; state.formRows[idx].unitType = unitType; state.formRows[idx].price = price; state.formRows[idx].kind = kind;
    const tr = document.querySelector('tr[data-row="'+idx+'"]');
    if(tr){ tr.querySelector('[data-field="name"]').value = name; tr.querySelector('[data-field="unitType"]').value = unitType; tr.querySelector('[data-field="price"]').value = price; }
    updateComputedUI();
  } else if(cid.startsWith('ac-pf-')){
    const idx = parseInt(cid.replace('ac-pf-',''));
    state.pfFormRows[idx].name = name; state.pfFormRows[idx].unitType = unitType; state.pfFormRows[idx].price = price; state.pfFormRows[idx].kind = kind;
    const tr = document.querySelector('tr[data-pfrow="'+idx+'"]');
    if(tr){ tr.querySelector('[data-pffield="name"]').value = name; tr.querySelector('[data-pffield="unitType"]').value = unitType; tr.querySelector('[data-pffield="price"]').value = price; }
    updateComputedUIPF();
  }
  container.style.display = 'none'; container.innerHTML = '';
});

app.addEventListener('click', (e)=>{
  if(e.target.closest('.ac-item')) return;
  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const action = btn.dataset.action;
  const idx = btn.dataset.index !== undefined ? parseInt(btn.dataset.index) : null;

  if(action === 'go-list'){ state.view='list'; render(); }
  else if(action === 'go-new'){ startNewRecipe(); }
  else if(action === 'go-semilist'){ state.view='semilist'; render(); }
  else if(action === 'go-new-semi'){ startNewSemi(); }
  else if(action === 'go-ingredients'){ state.view='ingredients'; render(); }
  else if(action === 'go-settings'){ state.view='settings'; render(); }
  else if(action === 'view-recipe'){ state.viewingId = btn.dataset.id; state.view='viewrecipe'; render(); }
  else if(action === 'view-semi'){ state.viewingId = btn.dataset.id; state.view='viewsemi'; render(); }
  else if(action === 'edit-recipe'){ startEditRecipe(btn.dataset.id); }
  else if(action === 'edit-semi'){ startEditSemi(btn.dataset.id); }
  else if(action === 'print-doc'){ window.print(); }
  else if(action === 'delete-recipe'){
    if(confirm('Удалить карточку блюда без возможности восстановления?')){
      state.recipes = state.recipes.filter(r=>r.id!==btn.dataset.id);
      persistAll(); render(); showToast('Карточка удалена');
    }
  }
  else if(action === 'delete-semi'){
    if(confirm('Удалить полуфабрикат? Он перестанет предлагаться в автокомплите блюд.')){
      state.semifinished = state.semifinished.filter(s=>s.id!==btn.dataset.id);
      persistAll(); render(); showToast('Полуфабрикат удалён');
    }
  }
  else if(action === 'add-row'){ state.formRows.push({ name:'', unitType:'g', gross:'', net:'', price:'', kind:'' }); render(); }
  else if(action === 'remove-row'){
    state.formRows.splice(idx,1);
    if(state.formRows.length===0) state.formRows.push({ name:'', unitType:'g', gross:'', net:'', price:'', kind:'' });
    render();
  }
  else if(action === 'add-pf-row'){ state.pfFormRows.push({ name:'', unitType:'g', gross:'', net:'', price:'', kind:'' }); render(); }
  else if(action === 'remove-pf-row'){
    state.pfFormRows.splice(idx,1);
    if(state.pfFormRows.length===0) state.pfFormRows.push({ name:'', unitType:'g', gross:'', net:'', price:'', kind:'' });
    render();
  }
  else if(action === 'add-step'){ state.formSteps.push(''); render(); }
  else if(action === 'remove-step'){ state.formSteps.splice(idx,1); if(state.formSteps.length===0) state.formSteps.push(''); render(); }
  else if(action === 'add-pfstep'){ state.pfFormSteps.push(''); render(); }
  else if(action === 'remove-pfstep'){ state.pfFormSteps.splice(idx,1); if(state.pfFormSteps.length===0) state.pfFormSteps.push(''); render(); }
  else if(action === 'save-recipe'){ saveRecipe(); }
  else if(action === 'save-semi'){ saveSemi(); }
  else if(action === 'add-ingredient'){ state.ingredients.push({ name:'', unitType:'g', price:'' }); render(); }
  else if(action === 'delete-ingredient'){ state.ingredients.splice(idx,1); persistAll(); render(); showToast('Продукт удалён из справочника'); }
  else if(action === 'export-backup'){ exportBackup(); }
  else if(action === 'import-backup'){ triggerImport(); }
  else if(action === 'install-app'){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt = null; render(); });
    }
  }
  else if(action === 'dismiss-install'){
    installDismissed = true;
    try{ localStorage.setItem('ttk-install-dismissed','1'); }catch(e){}
    render();
  }
  else if(action === 'connect-db'){
    const binInput = document.getElementById('bin-id-input');
    const keyInput = document.getElementById('api-key-input');
    const binId = binInput ? binInput.value.trim() : '';
    const apiKey = keyInput ? keyInput.value.trim() : '';
    if(!binId || !apiKey){ showToast('Вставь Bin ID и API-ключ', 'error'); return; }
    state.binId = binId; state.apiKey = apiKey;
    setStored('ttk-bin-id', binId); setStored('ttk-api-key', apiKey);
    state.loaded = false; render();
    loadData().then(()=>{ if(state.view==='settings'){ state.view='list'; render(); } showToast('База подключена'); });
  }
  else if(action === 'disconnect-db'){
    if(confirm('Отключить базу на этом устройстве? Данные в самом бине не удаляются.')){
      state.binId = ''; state.apiKey = '';
      setStored('ttk-bin-id',''); setStored('ttk-api-key','');
      render(); showToast('База отключена на этом устройстве');
    }
  }
});

app.addEventListener('input', (e)=>{
  const t = e.target;
  if(t.id === 'import-file-input') return;
  if(t.dataset.meta !== undefined){
    if(t.dataset.meta === 'search'){ state.search = t.value; renderListSoft(); return; }
    if(t.dataset.meta === 'categoryFilter'){ state.categoryFilter = t.value; render(); return; }
    state.formMeta[t.dataset.meta] = t.value; updateComputedUI(); return;
  }
  if(t.dataset.pfmeta !== undefined){ state.pfFormMeta[t.dataset.pfmeta] = t.value; updateComputedUIPF(); return; }
  if(t.dataset.field !== undefined){
    const i = parseInt(t.dataset.index);
    state.formRows[i][t.dataset.field] = t.value;
    if(t.dataset.field === 'name'){ renderSuggestionsBox('ac-row-'+i, t.value, true); }
    updateComputedUI(); return;
  }
  if(t.dataset.pffield !== undefined){
    const i = parseInt(t.dataset.pfindex);
    state.pfFormRows[i][t.dataset.pffield] = t.value;
    if(t.dataset.pffield === 'name'){ renderSuggestionsBox('ac-pf-'+i, t.value, false); }
    updateComputedUIPF(); return;
  }
  if(t.dataset.step !== undefined){ state.formSteps[parseInt(t.dataset.step)] = t.value; return; }
  if(t.dataset.pfstep !== undefined){ state.pfFormSteps[parseInt(t.dataset.pfstep)] = t.value; return; }
  if(t.dataset.ingField !== undefined){ state.ingredients[parseInt(t.dataset.ingIndex)][t.dataset.ingField] = t.value; return; }
});

app.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.id === 'import-file-input'){ const f = t.files[0]; handleImportFile(f); t.value=''; return; }
  if(t.dataset.field === 'unitType'){ state.formRows[parseInt(t.dataset.index)].unitType = t.value; updateComputedUI(); }
  if(t.dataset.pffield === 'unitType'){ state.pfFormRows[parseInt(t.dataset.pfindex)].unitType = t.value; updateComputedUIPF(); }
  if(t.dataset.pfmeta === 'outputUnit'){ state.pfFormMeta.outputUnit = t.value; updateComputedUIPF(); }
  if(t.dataset.ingField !== undefined){ persistAll(); }
});

app.addEventListener('focusout', (e)=>{
  const t = e.target;
  if(t.dataset && (t.dataset.field === 'name' || t.dataset.pffield === 'name')){ setTimeout(()=>closeAllSuggestions(), 120); }
}, true);

function renderListSoft(){
  const toolbarInput = document.querySelector('.toolbar input[type=text]');
  const cursorPos = toolbarInput ? toolbarInput.selectionStart : null;
  const wasFocused = document.activeElement === toolbarInput;
  render();
  if(wasFocused){
    const newInput = document.querySelector('.toolbar input[type=text]');
    if(newInput){ newInput.focus(); if(cursorPos!==null) newInput.setSelectionRange(cursorPos,cursorPos); }
  }
}

function saveRecipe(){
  const meta = state.formMeta;
  if(!meta.name || !meta.name.trim()){ showToast('Укажите название блюда', 'error'); return; }
  const validRows = state.formRows.filter(r => r.name.trim() && num(r.gross)>0 && num(r.price)>0);
  if(validRows.length === 0){ showToast('Добавьте хотя бы один ингредиент с весом и ценой', 'error'); return; }
  const now = Date.now();
  const recipe = {
    id: state.editingId || uid(), name: meta.name.trim(), category: meta.category.trim(),
    portions: num(meta.portions) || 1, foodCostTarget: num(meta.foodCostTarget) || 30, notes: meta.notes,
    rows: state.formRows.filter(r=>r.name.trim()), steps: state.formSteps.filter(s=>s.trim()),
    createdAt: state.editingId ? (state.recipes.find(r=>r.id===state.editingId)||{}).createdAt || now : now, updatedAt: now,
  };
  const i = state.recipes.findIndex(r=>r.id===recipe.id);
  if(i>=0) state.recipes[i] = recipe; else state.recipes.push(recipe);
  persistAll();
  state.view = 'list'; render();
  showToast('Карточка сохранена');
}
function saveSemi(){
  const meta = state.pfFormMeta;
  if(!meta.name || !meta.name.trim()){ showToast('Укажите название полуфабриката', 'error'); return; }
  if(!(num(meta.outputQty) > 0)){ showToast('Укажите выход партии больше нуля', 'error'); return; }
  const validRows = state.pfFormRows.filter(r => r.name.trim() && num(r.gross)>0 && num(r.price)>0);
  if(validRows.length === 0){ showToast('Добавьте хотя бы один ингредиент с весом и ценой', 'error'); return; }
  const now = Date.now();
  const sf = {
    id: state.pfEditingId || uid(), name: meta.name.trim(), outputUnit: meta.outputUnit, outputQty: num(meta.outputQty), notes: meta.notes,
    rows: state.pfFormRows.filter(r=>r.name.trim()), steps: state.pfFormSteps.filter(s=>s.trim()),
    createdAt: state.pfEditingId ? (state.semifinished.find(s=>s.id===state.pfEditingId)||{}).createdAt || now : now, updatedAt: now,
  };
  const i = state.semifinished.findIndex(s=>s.id===sf.id);
  if(i>=0) state.semifinished[i] = sf; else state.semifinished.push(sf);
  persistAll();
  state.view = 'semilist'; render();
  showToast('Полуфабрикат сохранён');
}

/* ======================= PWA: УСТАНОВКА НА ЭКРАН ======================= */
let deferredInstallPrompt = null;
let installDismissed = false;
try{ installDismissed = localStorage.getItem('ttk-install-dismissed') === '1'; }catch(e){}

function isStandaloneMode(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function isIosDevice(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!installDismissed && state.loaded) render();
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; render(); });

function renderInstallBanner(){
  if(isStandaloneMode() || installDismissed) return '';
  if(deferredInstallPrompt){
    return `<div class="install-banner no-print">
      <span>Установи приложение на экран — открывается быстрее, без адресной строки.</span>
      <span style="display:flex; gap:6px; flex-shrink:0;">
        <button data-action="install-app">Установить</button>
        <button class="x" data-action="dismiss-install">✕</button>
      </span>
    </div>`;
  }
  if(isIosDevice()){
    return `<div class="install-banner no-print">
      <span>На iPhone: «Поделиться» внизу Safari → «На экран «Домой»» — приложение откроется как отдельная иконка.</span>
      <button class="x" data-action="dismiss-install">✕</button>
    </div>`;
  }
  return '';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ======================= INIT ======================= */
loadData();
</script>

</html>
